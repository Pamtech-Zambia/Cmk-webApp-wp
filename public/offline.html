<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Offline — CMK Baking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E8577B" />
    <style>
      :root {
        color-scheme: light;
        --bg: #fff4e8;
        --fg: #3a2a1f;
        --muted: #7a6a5f;
        --primary: #e8577b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 1.5rem;
        text-align: center;
      }
      main { max-width: 28rem; }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.25rem;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 2rem;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.75rem;
        margin: 0 0 0.5rem;
      }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 1.5rem; }
      button {
        background: var(--primary);
        color: #fff;
        border: 0;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">&#127874;</div>
      <h1>You are offline</h1>
      <p>Check your connection and try again. Your birthday wishes will be waiting.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
